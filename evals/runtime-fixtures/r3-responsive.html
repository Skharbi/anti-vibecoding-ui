<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>*{box-sizing:border-box}body{margin:0;font:16px system-ui;display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100vh}aside{padding:20px;border-right:1px solid #ddd}main{min-width:0;padding:20px 20px 100px}.table-wrap{overflow:auto;max-width:100%}table{border-collapse:collapse;min-width:680px;width:100%}th,td{padding:10px;border:1px solid #ddd}.footer{position:fixed;left:240px;right:0;bottom:0;background:#fff;border-top:1px solid #ddd;padding:12px;display:flex;justify-content:flex-end}.submit{min-height:44px}.mobile-nav{display:none}@media(max-width:760px){body{display:block}aside{display:none}.mobile-nav{display:block;padding:12px;border-bottom:1px solid #ddd}main{padding:16px 16px 96px}.footer{left:0;padding-bottom:calc(12px + env(safe-area-inset-bottom))}table{min-width:560px}}</style><body><aside>Navigation</aside><div><div class="mobile-nav">Menu</div><main><h1>Claims queue</h1><div class="table-wrap"><table><tr><th>Patient</th><th>Status</th><th>Payer</th><th>Updated</th></tr><tr><td>Long Example Name</td><td>Needs review</td><td>Example Health</td><td>Today</td></tr></table></div><form><label>Note<textarea style="width:100%;min-height:120px"></textarea></label><button class="submit">Submit</button></form></main><div class="footer"><button class="submit">Submit claim</button></div></div></body>
