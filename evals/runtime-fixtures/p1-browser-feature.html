<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{font:16px system-ui;padding:20px}.box{padding:16px;border:1px solid #bbb}</style><div class="box" id="status">Checking capability…</div><button id="go">Run transition</button><script>const statusEl=document.getElementById('status');const goEl=document.getElementById('go');const supported=typeof document.startViewTransition==='function';statusEl.textContent=supported?'View Transitions supported; enhancement enabled.':'View Transitions unavailable; standard DOM update fallback active.';goEl.onclick=()=>{const update=()=>statusEl.textContent='Updated';if(supported)document.startViewTransition(update);else update()};document.body.dataset.result=JSON.stringify({featureDetected:true,fallbackPresent:true,supported});</script>
