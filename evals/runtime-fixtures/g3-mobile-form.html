<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>*{box-sizing:border-box}body{margin:0;font:16px system-ui;min-height:100vh}.wrap{max-width:560px;margin:auto;padding:20px 16px 110px}label{display:block;font-weight:600;margin:16px 0 6px}input,select,textarea{width:100%;min-height:44px;padding:10px;font:inherit}.actions{position:fixed;left:0;right:0;bottom:0;background:white;border-top:1px solid #ddd;padding:12px max(16px,env(safe-area-inset-right)) calc(12px + env(safe-area-inset-bottom));display:flex;justify-content:center}.actions button{width:min(528px,100%);min-height:48px}</style><main class="wrap"><h1>Insurance authorization</h1><form id="f"><label for="member">Member ID</label><input id="member" name="member"><label for="reason">Clinical reason</label><textarea id="reason"></textarea><label for="urgency">Urgency</label><select id="urgency"><option>Routine</option><option>Urgent</option></select><div id="error" role="alert"></div></form></main><div class="actions"><button form="f" type="submit">Submit authorization</button></div><script>f.addEventListener('submit',e=>{e.preventDefault();error.textContent=member.value?'':'Member ID is required'})</script>
